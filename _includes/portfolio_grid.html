<!-- portfolio Grid Section -->
<section id="portfolio">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Pages<br></h2>
      </div>
    </div>

    <!--
      Signpost image with one clickable area per sign.
      Each link pulls its target from the matching post in _posts/,
      and is positioned over its sign by the .sign-<caption> classes
      in css/main.css (PAGES SIGNPOST section).
    -->
    <div class="signpost">
      <img src="img/MainPageButtons.png" class="signpost-image" alt="Signpost with signs for Vote Sites, Store, Rules and Wiki">

      {% for post in site.posts %}
        {% assign sign-class = post.caption | slugify %}
        {% if post.modal-id %}
          <a href="#{{ post.modal-id }}" class="signpost-link sign-{{ sign-class }}" data-toggle="modal" aria-label="{{ post.caption }}">
            <span class="sr-only">{{ post.caption }}</span>
          </a>
        {% else %}
          <a href="{{ post.redirect }}" class="signpost-link sign-{{ sign-class }}" aria-label="{{ post.caption }}">
            <span class="sr-only">{{ post.caption }}</span>
          </a>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</section>
